name: flutter_webrtc_face_detection
description: >-
  Flutter WebRTC plugin with an on-device ML face-detection, blink/wink, and
  frame-capture pipeline. Hard fork of flutter_webrtc.
version: 0.1.0
homepage: https://github.com/arfuhad/flutter-webrtc-face-detection
repository: https://github.com/arfuhad/flutter-webrtc-face-detection
issue_tracker: https://github.com/arfuhad/flutter-webrtc-face-detection/issues
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=1.22.0"

dependencies:
  collection: ^1.17.0
  dart_webrtc: ^1.8.0
  flutter:
    sdk: flutter
  logger: ^2.0.2+1
  path_provider: ^2.0.2
  web: ^1.0.0
  webrtc_interface: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  lints: ^4.0.0
  pedantic: ^1.11.1
  test: any

flutter:
  plugin:
    platforms:
      android:
        package: com.cloudwebrtc.webrtc
        pluginClass: FlutterWebRTCPlugin
      ios:
        pluginClass: FlutterWebRTCPlugin
      macos:
        pluginClass: FlutterWebRTCPlugin
      windows:
        pluginClass: FlutterWebRTCPlugin
      linux:
        pluginClass: FlutterWebRTCPlugin
      elinux:
        pluginClass: FlutterWebRTCPlugin
