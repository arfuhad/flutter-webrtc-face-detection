# .github/workflows/publish.yml
name: Publish to pub.dev

# NOTE: Automated tag-triggered publishing is disabled until the pub.dev
# publisher + GitHub automated-publishing source are configured for
# `flutter_webrtc_face_detection` (M5). Until then this is manual-dispatch only
# so a stray `v*` tag cannot fire an unconfigured publish.
on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    # with:
    #   working-directory: path/to/package/within/repository
